
name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project
        run: |
          mkdir -p www
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 adhan@4.4.3
          npm install --save-dev @capacitor/assets

          cp index.html www/index.html
          cp "$(find node_modules/adhan -name 'adhan.umd.min.js' | head -n1)" www/adhan.umd.min.js

          printf '{"appId":"com.mishkat.app","appName":"مشكاة","webDir":"www"}' > capacitor.config.json

          npx cap add android
          npx @capacitor/assets generate --android

          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/></manifest>#' android/app/src/main/AndroidManifest.xml

          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mishkat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
