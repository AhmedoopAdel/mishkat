name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www/books www/fonts/amiri/files www/fonts/cairo/files
          npm init -y
          npm install --save-exact @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 adhan@4.4.3 pdfjs-dist@3.11.174 @fontsource/amiri@5.3.0 @fontsource/cairo@5.3.0
          cp index.html www/index.html
          cp ar_algame3_fe_fatwa_alhajj.pdf www/books/ar_algame3_fe_fatwa_alhajj.pdf
          cp "$(find node_modules/adhan -name 'adhan.umd.min.js' | head -n1)" www/adhan.umd.min.js
          cp node_modules/pdfjs-dist/legacy/build/pdf.min.js www/pdf.min.js
          cp node_modules/pdfjs-dist/legacy/build/pdf.worker.min.js www/pdf.worker.min.js
          for weight in 400 700; do
            cp "node_modules/@fontsource/amiri/arabic-${weight}.css" www/fonts/amiri/
            cp "node_modules/@fontsource/amiri/latin-${weight}.css" www/fonts/amiri/
          done
          for weight in 400 600 700; do
            cp "node_modules/@fontsource/cairo/arabic-${weight}.css" www/fonts/cairo/
            cp "node_modules/@fontsource/cairo/latin-${weight}.css" www/fonts/cairo/
          done
          cp node_modules/@fontsource/amiri/files/amiri-*.woff2 www/fonts/amiri/files/
          cp node_modules/@fontsource/cairo/files/cairo-*.woff2 www/fonts/cairo/files/
          printf '{"appId":"com.mishkat.app","appName":"مشكاة","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mishkat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
